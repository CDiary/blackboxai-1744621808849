<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Auth App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('https://images.pexels.com/photos/3184291/pexels-photo-3184291.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="bg-white p-8 rounded-lg shadow-2xl w-96 backdrop-blur-lg bg-opacity-90">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Create Account</h1>
            <p class="text-gray-600">Join us today</p>
        </div>

        <form id="registerForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="username">
                    Username
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <i class="fas fa-user text-gray-400"></i>
                    </span>
                    <input type="text" id="username" name="username" required
                        class="pl-10 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Choose a username">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="password">
                    Password
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <i class="fas fa-lock text-gray-400"></i>
                    </span>
                    <input type="password" id="password" name="password" required
                        class="pl-10 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Create a password">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="securityCode">
                    Security Code
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <i class="fas fa-shield-alt text-gray-400"></i>
                    </span>
                    <input type="password" id="securityCode" name="securityCode" required
                        class="pl-10 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Enter security code">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="sessionDuration">
                    Session Duration (minutes)
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <i class="fas fa-clock text-gray-400"></i>
                    </span>
                    <input type="number" id="sessionDuration" name="sessionDuration" required min="1"
                        class="pl-10 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Enter session duration" value="60">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="permission">
                    Permission Level
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <i class="fas fa-user-shield text-gray-400"></i>
                    </span>
                    <select id="permission" name="permission" required
                        class="pl-10 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2" for="validityDays">
                    Account Validity (days)
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <i class="fas fa-calendar text-gray-400"></i>
                    </span>
                    <input type="number" id="validityDays" name="validityDays" required min="1"
                        class="pl-10 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Enter validity period" value="365">
                </div>
            </div>

            <div>
                <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors duration-300">
                    Create Account
                </button>
            </div>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-600">Already have an account?
                <a href="login.html" class="text-blue-600 hover:text-blue-700 font-medium">Sign In</a>
            </p>
        </div>
    </div>

    <script>
        const SECURITY_CODE = '123456'; // Default security code

        async function loadUsers() {
            try {
                const response = await fetch('/database/users.json');
                const data = await response.json();
                return data.users || [];
            } catch (error) {
                console.error('Error loading users:', error);
                return [];
            }
        }

        async function saveUser(user) {
            try {
                const users = await loadUsers();
                users.push(user);
                
                // Send updated users to the server
                const response = await fetch('/save-users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ users: users })
                });

                if (!response.ok) {
                    throw new Error('Failed to save user');
                }

                const result = await response.json();
                if (result.success) {
                    alert('User registered successfully!');
                    return true;
                } else {
                    throw new Error('Failed to save user');
                }
            } catch (error) {
                console.error('Error saving user:', error);
                alert('Failed to register user. Please try again.');
                return false;
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const securityCode = document.getElementById('securityCode').value;
            
            if (securityCode !== SECURITY_CODE) {
                alert('Invalid security code');
                return;
            }
            
            try {
                const users = await loadUsers();
                if (users.some(u => u.username === username)) {
                    alert('Username already exists');
                    return;
                }
                
                const sessionDuration = parseInt(document.getElementById('sessionDuration').value);
                const permission = document.getElementById('permission').value;
                const validityDays = parseInt(document.getElementById('validityDays').value);
                
                // Calculate account validity date
                const validityDate = new Date();
                validityDate.setDate(validityDate.getDate() + validityDays);

                const newUser = {
                    username,
                    password,
                    permission,
                    session_duration: sessionDuration,
                    created_at: new Date().toISOString(),
                    account_validity: validityDate.toISOString(),
                    last_login: null,
                    login_duration: 0
                };
                
                const success = await saveUser(newUser);
                if (success) {
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error('Error during registration:', error);
                alert('An error occurred during registration. Please try again.');
            }
        });
    </script>
</body>
</html>
